name: FOMC Pipeline Automation

on:
  schedule:
    # Runs at 18:01 and 18:05 UTC (2:01 PM and 2:05 PM EDT) every Wednesday
    - cron: '1,5 18 * * 3'
  workflow_dispatch: # This allows us to click a button and run it right now!

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper Pipeline
        run: python src/data_pipeline.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data sync: FOMC Ledger" && git push)
